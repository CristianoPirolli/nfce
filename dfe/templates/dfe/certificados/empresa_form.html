{% extends 'dfe/base.html' %}
{% block title %}Nova empresa{% endblock %}
{% block content %}
<h1>Nova empresa</h1>
<div class="card" style="max-width:520px;">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit" class="btn btn-primary">Salvar e ir para o certificado</button>
            <a href="{% url 'dfe:lista_empresas' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
